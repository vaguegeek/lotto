<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎱 6/45 로또</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Arial', sans-serif; background: #f5f5f5; }
        nav {
            background: #1a237e; color: white;
            padding: 15px 30px;
            display: flex; justify-content: space-between; align-items: center;
        }
        nav a { color: white; text-decoration: none; margin-left: 20px; }
        nav a:hover { text-decoration: underline; }
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .card {
            background: white; border-radius: 12px;
            padding: 30px; margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .btn {
            padding: 10px 24px; border: none; border-radius: 8px;
            cursor: pointer; font-size: 16px; text-decoration: none;
            display: inline-block;
        }
        .btn-primary { background: #1a237e; color: white; }
        .btn-danger { background: #c62828; color: white; }
        .btn-success { background: #2e7d32; color: white; }
        .ball {
            display: inline-flex; align-items: center; justify-content: center;
            width: 40px; height: 40px; border-radius: 50%;
            font-weight: bold; color: white; margin: 3px;
        }
        .ball-yellow { background: #f9a825; }
        .ball-blue { background: #1565c0; }
        .ball-red { background: #c62828; }
        .ball-gray { background: #616161; }
        .messages { margin-bottom: 20px; }
        .message {
            padding: 12px 20px; border-radius: 8px; margin-bottom: 8px;
        }
        .message-success { background: #e8f5e9; color: #2e7d32; }
        .message-error { background: #ffebee; color: #c62828; }
    </style>
</head>
<body>
    <nav>
        <a href="/" style="font-size: 20px; font-weight: bold;">🎱 6/45 로또</a>
        <div>
            {% if user.is_authenticated %}
                <a href="/tickets/">홈</a>
                <a href="/tickets/my/">내 복권</a>
                <a href="/draws/">추첨 결과</a>
                {% if user.is_staff %}
                    <a href="/admin/">관리자</a>
                {% endif %}
                <a href="/accounts/logout/">로그아웃 ({{ user.username }})</a>
            {% else %}
                <a href="/accounts/login/">로그인</a>
                <a href="/accounts/register/">회원가입</a>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="message message-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
