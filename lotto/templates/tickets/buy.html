{% extends 'base.html' %}
{% block content %}
<div class="card">
    <h2 style="margin-bottom: 24px;">🎟️ 복권 구매 - 제 {{ upcoming_draw.round_number }}회차</h2>
    <form method="post">
        {% csrf_token %}
        <div style="margin-bottom: 24px;">
            <label style="font-weight: bold; font-size: 18px;">구매 방식 선택</label>
            <div style="margin-top: 12px;">
                <label style="margin-right: 24px;">
                    <input type="radio" name="ticket_type" value="auto" checked>
                    🎲 자동 (랜덤으로 번호 선택)
                </label>
                <label>
                    <input type="radio" name="ticket_type" value="manual">
                    ✏️ 수동 (직접 번호 선택)
                </label>
            </div>
        </div>

        <div id="manual-input" style="display: none; margin-bottom: 24px;">
            <label style="font-weight: bold;">번호 입력 (1~45, 6개)</label>
            <div style="margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap;">
                {% for i in "123456" %}
                <input type="number" name="num{{ i }}" min="1" max="45"
                    style="width: 70px; padding: 10px; font-size: 18px; text-align: center;
                           border: 2px solid #1a237e; border-radius: 8px;">
                {% endfor %}
            </div>
        </div>

        <button type="submit" class="btn btn-primary" style="font-size: 18px; padding: 14px 40px;">
            구매하기
        </button>
        <a href="/" class="btn" style="background: #eee; margin-left: 12px;">취소</a>
    </form>
</div>

<script>
    document.querySelectorAll('input[name="ticket_type"]').forEach(radio => {
        radio.addEventListener('change', function() {
            document.getElementById('manual-input').style.display =
                this.value === 'manual' ? 'block' : 'none';
        });
    });
</script>
{% endblock %}
