{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 0 auto;">
    <h2 style="margin-bottom: 24px;">✏️ 회원가입</h2>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div style="margin-bottom: 16px;">
            <label style="display: block; margin-bottom: 6px; font-weight: bold;">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
            <p style="color: red; font-size: 13px;">{{ field.errors }}</p>
            {% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary" style="width: 100%;">회원가입</button>
    </form>
    <p style="margin-top: 16px; text-align: center;">
        이미 계정이 있으신가요? <a href="/accounts/login/">로그인</a>
    </p>
</div>
{% endblock %}
